<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doods</title>
<meta name="description" content="750 squishy little collectible Doods in 50 blind-bag series.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd93b'/%3E%3Cpath d='M32 9c13 0 19 12 19 25 0 12-7 19-19 19S13 46 13 34C13 21 19 9 32 9z' fill='%23ff5fa8' stroke='%233a1560' stroke-width='4'/%3E%3Cellipse cx='24' cy='33' rx='3.4' ry='4.4' fill='%233a1560'/%3E%3Cellipse cx='40' cy='33' rx='3.4' ry='4.4' fill='%233a1560'/%3E%3Cpath d='M28.500 38.500q3.500 3.500 7 0' fill='none' stroke='%233a1560' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a1560; --pink:#ff5fa8; --yellow:#ffd93b; --theme:#a646d8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#fff; font-family:Fredoka,ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif; color:var(--ink); }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  header { position:fixed; top:0; left:0; right:0; padding:calc(22px + env(safe-area-inset-top)) 16px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; pointer-events:none; }
  h1 { margin:0; line-height:0; }
  #logo { width:clamp(180px,44vw,290px); height:auto; margin:-14px 0 -16px -8px; display:block; }
  .sub { margin-top:6px; display:inline-block; background:var(--ink); color:#fff; font-weight:600; font-size:13px; padding:4px 10px; border-radius:99px; letter-spacing:.4px; }
  .burst { flex:none; width:86px; height:86px; display:grid; place-items:center; text-align:center; background:var(--yellow); color:#d3122f; font-weight:700; line-height:.95; font-size:22px; transform:rotate(10deg);
           clip-path:polygon(50% 0,61% 12%,75% 7%,79% 21%,93% 25%,88% 39%,100% 50%,88% 61%,93% 75%,79% 79%,75% 93%,61% 88%,50% 100%,39% 88%,25% 93%,21% 79%,7% 75%,12% 61%,0 50%,12% 39%,7% 25%,21% 21%,25% 7%,39% 12%); }
  .burst small { display:block; font-size:10px; color:var(--ink); letter-spacing:.5px; }
  button { font:inherit; font-weight:600; border:0; cursor:pointer; color:var(--ink); background:#fff; border-radius:99px; padding:9px 16px; box-shadow:0 3px 0 var(--ink); pointer-events:auto; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  button.hot { background:var(--pink); color:#fff; }
  [hidden] { display:none !important; }
  #bar { position:fixed; left:0; right:0; top:calc(134px + env(safe-area-inset-top)); display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; padding:0 12px; pointer-events:none; }
  #bar .grp { display:flex; gap:6px; align-items:center; }
  #bar button { padding:7px 12px; font-size:14px; background:#f3ecfb; box-shadow:0 3px 0 #cdbbe4; }
  #tpick { min-width:170px; background:var(--theme) !important; color:#fff !important; box-shadow:0 3px 0 var(--ink) !important; line-height:1.05; padding:5px 16px !important; }
  #tpick small { display:block; font-size:10px; font-weight:600; opacity:.9; letter-spacing:.6px; text-transform:uppercase; }
  #swipe { position:fixed; left:50%; top:58%; transform:translateX(-50%); z-index:6; text-align:center; pointer-events:none; color:#fff; font:700 22px Fredoka, sans-serif; text-shadow:0 2px 0 var(--ink),0 0 12px rgba(58,21,96,.6); }
  #swipe .track { width:220px; height:44px; margin:0 auto 6px; border-radius:22px; background:rgba(255,255,255,.22); border:3px dashed #fff; position:relative; }
  #swipe .finger { position:absolute; top:2px; left:6px; font-size:32px; animation:swipe 1.3s ease-in-out infinite; }
  @keyframes swipe { 0% { left:6px; opacity:0 } 15% { opacity:1 } 85% { left:170px; opacity:1 } 100% { left:180px; opacity:0 } }
  #snd { position:fixed; right:14px; bottom:14px; z-index:7; width:46px; height:46px; border-radius:50%; font-size:22px; }
  #mode button.on { background:var(--ink); color:#fff; box-shadow:0 3px 0 var(--pink); }
  @media (min-width:1100px) { #bar { top:26px; } }
  #foot { position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; transition:opacity .25s; }
  #hint { color:#8a74a8; font-weight:600; font-size:14px; }
  #card { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); max-width:400px; margin:0 auto; background:#fff; border-radius:22px; padding:16px 16px 14px; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink),0 14px 30px rgba(40,0,80,.18);
          transform:translateY(130%); transition:transform .35s cubic-bezier(.3,1.4,.5,1); }
  #card.on { transform:none; }
  #card .no { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--pink); padding-right:40px; }
  #card h2 { margin:0 0 2px; font-size:30px; line-height:1; }
  #new { display:inline-block; vertical-align:middle; margin-left:8px; font-size:13px; background:var(--yellow); color:#d3122f; padding:2px 8px; border-radius:99px; transform:rotate(-6deg); }
  #card p { margin:6px 0 10px; font-size:15px; font-weight:500; line-height:1.3; color:#5b3f7a; }
  #x { position:absolute; top:10px; right:10px; width:34px; height:34px; padding:0; background:#f1e4ff; box-shadow:none; }
  .stats { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; font-size:12px; font-weight:700; letter-spacing:.8px; margin-bottom:12px; }
  .pips { display:flex; gap:4px; }
  .pips i { flex:1; max-width:34px; height:9px; border-radius:9px; background:#eadcf7; }
  .pips i.f { background:var(--c,#a646d8); }
  .row { display:flex; gap:8px; }
  .row .hot { flex:1; }
  @media (min-width:760px) { #card { left:24px; right:auto; margin:0; bottom:24px; width:360px; } }
  #picker { position:fixed; inset:0; background:rgba(255,255,255,.96); display:none; flex-direction:column; padding:calc(16px + env(safe-area-inset-top)) 14px 14px; }
  #picker.on { display:flex; }
  #picker h3 { margin:0 44px 12px 2px; font-size:24px; }
  #pclose { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; width:38px; height:38px; padding:0; background:#f1e4ff; box-shadow:none; }
  #pgrid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; align-content:start; padding:2px 2px 20px; }
  #pgrid button { border-radius:16px; padding:12px 12px 14px; text-align:left; color:#fff; font-size:16px; line-height:1.1; text-shadow:0 1px 0 rgba(58,21,96,.6); min-height:66px; }
  #pgrid small { display:block; font-size:11px; opacity:.9; letter-spacing:1px; }
  #err { position:fixed; inset:0; display:none; place-items:center; padding:30px; text-align:center; color:var(--ink); font-weight:600; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" aria-label="Doods: collectible toy characters and their blind-bag packaging"></canvas>
<header>
  <div>
    <h1><canvas id="logo" role="img" aria-label="Doods"></canvas></h1>
    <div class="sub">SQUISH ’EM · COLLECT ’EM · 750 TO FIND</div>
  </div>
  <div class="burst"><div><small>ONLY</small>$4.97<small>EACH!</small></div></div>
</header>
<nav id="bar" aria-label="Series">
  <div class="grp">
    <button id="tprev" aria-label="Previous series">◀</button>
    <button id="tpick"><small id="tnum"></small><span id="tname"></span> ▾</button>
    <button id="tnext" aria-label="Next series">▶</button>
  </div>
  <div class="grp" id="mode">
    <button data-m="box">📦 Blind bags</button>
    <button data-m="lineup">👀 All 15</button>
    <button data-m="play">🤸 Play</button>
  </div>
</nav>
<div id="swipe" hidden><div class="track"><span class="finger">👉</span></div><b>Swipe across to rip it!</b></div>
<button id="snd" aria-label="Sound">🔈</button>
<div id="foot">
  <div id="hint"></div>
  <button id="all"></button>
</div>
<div id="card" aria-live="polite">
  <button id="x" aria-label="Close">✕</button>
  <div class="no"></div>
  <h2 style="display:inline-block"></h2><span id="new" hidden>NEW!</span>
  <p></p>
  <div class="stats"></div>
  <div class="row">
    <button id="prev" aria-label="Previous">◀</button>
    <button id="again" class="hot">🎲 Rip another</button>
    <button id="glb">⬇ 3D model</button>
    <button id="next" aria-label="Next">▶</button>
  </div>
</div>
<div id="picker" role="dialog" aria-label="Choose a series">
  <h3>Pick a series</h3>
  <button id="pclose" aria-label="Close">✕</button>
  <div id="pgrid"></div>
</div>
<div id="err">Couldn't start 3D on this device 😢</div>
<script type="module" src="main.js"></script>
</body>
</html>
