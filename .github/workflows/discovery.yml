name: Refresh discovery data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build discovery/data.json
        run: python3 scripts/build_discovery.py
      - name: Commit if changed
        run: |
          git config user.name "discovery-bot"
          git config user.email "discovery-bot@users.noreply.github.com"
          git add discovery/data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh discovery data"
            git push
          fi
