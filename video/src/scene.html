<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const C = document.getElementById('c');
const X = C.getContext('2d');
const W = 1080, H = 1920;

/* ---------- palette ---------- */
const LINEN_A = '#f3ece1', LINEN_B = '#e4d9c8';
const INK = '#241f19', INK_SOFT = '#6b6055';
const GOLD_D = '#8a6a1f', GOLD_M = '#d9b451', GOLD_L = '#f5e39c';
const STEEL_D = '#7d8288', STEEL_M = '#b9bfc5', STEEL_L = '#e6eaee';

/* ---------- easing ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
// deterministic pseudo-noise
const noise=(x)=>Math.sin(x*12.9898)*43758.5453%1;
const nz=(x)=>{const v=noise(x);return v-Math.floor(v)-0.5;};

/* segment helper: returns 0..1 progress within [a,b], clamped */
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

/* ---------- primitives ---------- */
function roundRect(x,y,w,h,r){
  X.beginPath();
  X.moveTo(x+r,y);
  X.arcTo(x+w,y,x+w,y+h,r);
  X.arcTo(x+w,y+h,x,y+h,r);
  X.arcTo(x,y+h,x,y,r);
  X.arcTo(x,y,x+w,y,r);
  X.closePath();
}

function metalGrad(x,y,w,h,d,m,l){
  const g=X.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,l); g.addColorStop(.35,m);
  g.addColorStop(.62,d); g.addColorStop(1,m);
  return g;
}

function background(t){
  const g=X.createLinearGradient(0,0,W*.3,H);
  g.addColorStop(0,LINEN_A); g.addColorStop(1,LINEN_B);
  X.fillStyle=g; X.fillRect(0,0,W,H);
  // soft vignette
  const v=X.createRadialGradient(W/2,H*.46,120,W/2,H*.46,H*.72);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(60,45,25,0.16)');
  X.fillStyle=v; X.fillRect(0,0,W,H);
}

/* chain: links along a shallow catenary from edge to the clasp end */
function chain(fromX, toX, y, sag, dir){
  const n=26;
  for(let i=0;i<=n;i++){
    const p=i/n;
    const x=fromX+(toX-fromX)*p;
    const yy=y+Math.sin(p*Math.PI)*sag*(1-p*0.25);
    const r=13+2*Math.sin(p*9);
    X.save();
    X.translate(x,yy);
    X.rotate((toX-fromX)>0?0.12*Math.sin(p*7):-0.12*Math.sin(p*7));
    X.strokeStyle = i%2 ? metalGrad(-r,-r*0.62,r*2,r*1.24,GOLD_D,GOLD_M,GOLD_L)
                        : metalGrad(-r,-r*0.62,r*2,r*1.24,GOLD_D,GOLD_L,GOLD_M);
    X.lineWidth=5.2;
    X.beginPath(); X.ellipse(0,0,r,r*0.62,0,0,Math.PI*2); X.stroke();
    X.restore();
  }
}

/* a magnetic clasp half — cylinder barrel */
function clasp(cx,cy,facing,scale,glow){
  const w=96*scale, h=64*scale;
  X.save();
  X.translate(cx,cy);
  // drop shadow
  X.save();
  X.filter='blur(10px)'; X.fillStyle='rgba(70,52,25,0.30)';
  roundRect(-w/2, -h/2+16*scale, w, h, h/2); X.fill();
  X.restore();

  if(glow>0){
    X.save();
    X.globalAlpha=glow;
    X.filter='blur(26px)';
    X.fillStyle='#ffe9ab';
    roundRect(-w/2-16,-h/2-16,w+32,h+32,(h+32)/2); X.fill();
    X.restore();
  }

  X.fillStyle=metalGrad(-w/2,-h/2,w,h,GOLD_D,GOLD_M,GOLD_L);
  roundRect(-w/2,-h/2,w,h,h/2); X.fill();

  // flat mating face on the inner side
  X.fillStyle='rgba(80,58,18,0.55)';
  const fx = facing>0 ? w/2-5*scale : -w/2;
  X.fillRect(fx,-h/2+3*scale,5*scale,h-6*scale);

  // specular
  X.save(); X.globalAlpha=.55;
  X.fillStyle='#fff6d8';
  roundRect(-w/2+12*scale,-h/2+8*scale,w-24*scale,10*scale,5*scale); X.fill();
  X.restore();
  X.restore();
}

/* a fiddly spring-ring clasp (the "before") */
function springRing(cx,cy,scale,openAmt){
  X.save(); X.translate(cx,cy); X.scale(scale,scale);
  X.strokeStyle=metalGrad(-30,-30,60,60,STEEL_D,STEEL_M,STEEL_L);
  X.lineWidth=9; X.lineCap='round';
  X.beginPath();
  X.arc(0,0,28, 0.35+openAmt, Math.PI*2+0.15-openAmt);
  X.stroke();
  X.fillStyle=STEEL_M;
  X.beginPath(); X.arc(24,-14,7,0,Math.PI*2); X.fill();
  X.restore();
}

/* ---------- type ---------- */
function textBlock(lines, y, size, color, alpha, weight, track){
  X.save();
  X.globalAlpha=alpha;
  X.textAlign='center'; X.textBaseline='middle';
  X.fillStyle=color;
  X.font=`${weight||600} ${size}px "DejaVu Sans", "Liberation Sans", system-ui, sans-serif`;
  if(track){ X.letterSpacing = track+'px'; }
  lines.forEach((ln,i)=>{
    X.fillText(ln, W/2, y + i*(size*1.22));
  });
  X.letterSpacing='0px';
  X.restore();
}

function textCard(lines,y,size,alpha){
  // dark plate behind text for legibility on any footage
  X.save();
  X.globalAlpha=alpha*0.92;
  X.textAlign='center';
  X.font=`700 ${size}px "DejaVu Sans","Liberation Sans",system-ui,sans-serif`;
  let maxw=0; lines.forEach(l=>maxw=Math.max(maxw,X.measureText(l).width));
  const padX=42,padY=30;
  const bh=lines.length*size*1.22+padY*2-size*0.22;
  roundRect(W/2-maxw/2-padX, y-size*0.72-padY, maxw+padX*2, bh, 14);
  X.fillStyle='rgba(28,23,17,0.90)'; X.fill();
  X.restore();
  textBlock(lines,y,size,'#fdf8ef',alpha,700,0);
}

/* ---------- the scene ---------- */
const DUR = 8.0;

function renderFrame(t){
  X.clearRect(0,0,W,H);
  background(t);

  const cy = 880;

  /* ---- ACT 1 (0.0–2.6): the fumble, steel spring ring ---- */
  const a1 = seg(t,0,2.6);
  /* ---- ACT 2 (2.6–4.2): converters slide together ---- */
  const a2 = seg(t,2.6,4.2);
  /* ---- SNAP at 4.2 ---- */
  const snap = seg(t,4.2,4.55);
  /* ---- ACT 3 settle ---- */
  const a3 = seg(t,4.55,6.2);
  /* ---- ACT 4 brand ---- */
  const a4 = seg(t,6.4,8.0);

  const inAct1 = t < 2.6;

  if(inAct1){
    // jittery near-miss
    const j = (1-easeOut(seg(t,0,0.5)));
    const wob = 26*Math.sin(t*13) + 34*nz(t*40);
    const gap = 190 - 60*easeOut(seg(t,0.6,2.4)) ;
    const lx = W/2-gap+wob*0.5, rx = W/2+gap-wob*0.5;
    chain(-60, lx-40, cy, 90, 1);
    chain(W+60, rx+40, cy, 90, -1);
    springRing(lx, cy+wob*0.25, 1.05, 0.15+0.12*Math.sin(t*9));
    springRing(rx, cy-wob*0.25, 1.05, 0.0);
    const ta = easeOut(seg(t,0.25,0.9)) * (1-easeIn(seg(t,2.15,2.55)));
    textCard(['Trying to do up','a necklace clasp.'], 1430, 74, ta);
  } else {
    // converters
    const gap = 210*(1-ease(a2));
    const lx = W/2-gap-48, rx = W/2+gap+48;
    const recoil = snap>0 && snap<1 ? Math.sin(snap*Math.PI)*16 : 0;
    const settle = a3>0 ? Math.exp(-a3*7)*Math.sin(a3*34)*10 : 0;

    chain(-60, lx-42, cy, 90 - 18*ease(a2), 1);
    chain(W+60, rx+42, cy, 90 - 18*ease(a2), -1);

    const glow = snap>0 ? Math.sin(clamp(snap,0,1)*Math.PI)*0.9 : 0;
    clasp(lx - recoil + settle, cy, 1, 1, glow);
    clasp(rx + recoil - settle, cy, -1, 1, glow);

    // snap flash ring
    if(snap>0 && snap<1){
      X.save();
      X.globalAlpha=(1-snap)*0.75;
      X.strokeStyle='#fff1c2'; X.lineWidth=8*(1-snap)+2;
      X.beginPath(); X.arc(W/2, cy, 70+150*snap, 0, Math.PI*2); X.stroke();
      X.restore();
    }

    const t2a = easeOut(seg(t,2.75,3.3)) * (1-easeIn(seg(t,4.0,4.3)));
    textCard(['Now it closes itself.'], 1430, 78, t2a);

    const t3a = easeOut(seg(t,4.7,5.2)) * (1-easeIn(seg(t,6.1,6.45)));
    textCard(['One hand.','One second.','No mirror.'], 1360, 84, t3a);
  }

  /* brand card */
  if(a4>0){
    X.save();
    X.globalAlpha = easeOut(seg(t,6.4,6.9));
    X.fillStyle='rgba(243,236,225,0.93)';
    X.fillRect(0,0,W,H);
    X.restore();
    const ba=easeOut(seg(t,6.6,7.1));
    textBlock(['EVERLY GRACE'], 900, 82, INK, ba, 700, 8);
    textBlock(['Magnetic clasp converters'], 1010, 44, INK_SOFT, ba*0.95, 400, 1);
    textBlock(['Set of three  ·  $29  ·  Free U.S. shipping'], 1130, 38, INK_SOFT, ba*0.9, 600, 0);
  }
}
window.renderFrame = renderFrame;
window.SCENE_DURATION = DUR;
renderFrame(0);
</script>
